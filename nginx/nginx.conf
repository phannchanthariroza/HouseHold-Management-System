events {}
http {
  upstream api_gateway {
    server api-gateway:3000;
  }

  upstream chore_backends {
    # Docker resolves multiple chore-service replicas when the service is scaled.
    server chore-service:3004;
  }
  server {
    listen 8080;
    location /health {
      return 200 'nginx load balancer running';
      add_header Content-Type text/plain;
    }
    location = /api/chores {
      proxy_pass http://chore_backends/chores;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
    }

    location /api/chores/ {
      proxy_pass http://chore_backends/chores/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
    }

    location / {
      proxy_pass http://api_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Authorization $http_authorization;
    }
  }
}
