services:
  api-gateway:
    build: ./api-gateway
    env_file: .env
    environment:
      PORT: 3000
      REGISTRATION_URL: http://registration-service:3001
      LOGIN_URL: http://login-service:3002
      HOUSEHOLD_URL: http://household-service:3003
      CHORE_URL: http://chore-service:3004
    ports:
      - "3000:3000"
    depends_on:
      - registration-service
      - login-service
      - household-service
      - chore-service
    restart: unless-stopped
    networks: [household-net]

  registration-service:
    build: ./registration-service
    env_file: .env
    environment: { PORT: 3001 }
    restart: unless-stopped
    networks: [household-net]

  login-service:
    build: ./login-service
    env_file: .env
    environment: { PORT: 3002 }
    restart: unless-stopped
    networks: [household-net]

  household-service:
    build: ./household-service
    env_file: .env
    environment: { PORT: 3003 }
    restart: unless-stopped
    networks: [household-net]

  chore-service:
    build: ./chore-service
    env_file: .env
    environment: { PORT: 3004 }
    restart: unless-stopped
    networks: [household-net]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - chore-service
    restart: unless-stopped
    networks: [household-net]

networks:
  household-net:
    driver: bridge
